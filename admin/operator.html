<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>店舗一覧（運営）｜ケーキ屋さんの予約帳</title>
<link rel="stylesheet" href="operator.css?v=1791594277">
<script defer src="operator.js?v=1791594277"></script>
</head>
<body>
<header class="toolbar"><a href="index.html">← 管理画面</a><h1>店舗一覧（運営）</h1><button id="reload" type="button" hidden>更新</button></header>
<div id="status" role="status" aria-live="polite">読み込み中…</div>
<div id="login" hidden><p>ログインが必要です。<a href="index.html">管理画面でログインする</a></p></div>
<main id="workspace" hidden>
 <section class="summary" id="summary" aria-label="件数のまとめ"></section>
 <div class="filters">
  <label>表示<select id="filter">
   <option value="all">すべての店</option>
   <option value="trial">お試し中</option>
   <option value="paid">有料契約中</option>
   <option value="stopped">止まっている（お試し終了・解約・支払い遅れ）</option>
  </select></label>
  <label>プラン<select id="plan">
   <option value="">すべて</option>
   <option value="standard">Standard</option>
   <option value="lite">Lite</option>
  </select></label>
  <label class="search">店名・URLで探す<input id="query" type="search" autocomplete="off"></label>
 </div>
 <p class="count" id="count"></p>
 <div class="table-wrap"><table id="list">
  <thead><tr>
   <th scope="col">店名</th><th scope="col">プラン</th><th scope="col">状態</th><th scope="col">お試し期限</th>
   <th scope="col">登録日</th><th scope="col">店主のログイン</th><th scope="col">商品<br><small>公開／全部</small></th>
   <th scope="col">予約<br><small>今月受取／累計</small></th><th scope="col">最後の予約</th>
  </tr></thead>
  <tbody id="rows"></tbody>
 </table></div>
 <p class="hint">予約の件数は本予約だけ（キャンセルを除く）。お試し中のテスト予約は保存されないので数に入りません。日時は日本時間。</p>
</main>
</body>
</html>
