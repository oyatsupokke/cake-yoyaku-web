<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード再設定</title>
<link rel="stylesheet" href="../styles.css?v=1791601794">
<link rel="stylesheet" href="admin.css?v=1791601794">
</head>
<body>
<div id="app" class="admin">
  <main>
    <div class="login-box">
      <h1>パスワード再設定</h1>
      <div id="reset-form">
        <label class="field">新しいパスワード（8文字以上）
          <input type="password" id="new-password" autocomplete="new-password">
        </label>
        <label class="field">新しいパスワード（確認）
          <input type="password" id="new-password2" autocomplete="new-password">
        </label>
        <button type="button" class="btn-primary" id="btn-reset">設定する</button>
        <p id="reset-error" class="error hidden"></p>
      </div>
      <div id="reset-done" class="hidden">
        <p>✔︎ 新しいパスワードを設定しました。</p>
        <p><a href="./index.html">ログイン画面へ</a></p>
      </div>
      <p id="reset-invalid" class="error hidden">リンクが無効か期限切れです。ログイン画面から再設定メールを送り直してください。<br><a href="./index.html">ログイン画面へ</a></p>
    </div>
  </main>
</div>
<script src="reset.js"></script>
</body>
</html>
